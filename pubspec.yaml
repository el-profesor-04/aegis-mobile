name: aegis_mobile
description: A privacy-first, on-device health reasoning engine.
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.1
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.1
  path: ^1.8.3
  intl: ^0.19.0
  provider: ^6.1.1
  uuid: ^4.3.3
  http: ^1.2.1
  flutter_markdown: ^0.7.3
  shared_preferences: ^2.2.3
  background_downloader: ^8.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
